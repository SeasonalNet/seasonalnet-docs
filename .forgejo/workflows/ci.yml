name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  basic:
    runs-on: docker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Repository sanity
        run: |
          test -f README.md || true
          find . -name '*.md' -print | sort